version = 2

[style]
# "themed": Omarchy colors; "branded": classic Syncthing icons
icon_style = "themed"
# "default": Syncthing's own UI; "modern": the bundled Syncshell UI
# "omarchy": the bundled UI following the active Omarchy theme
web_ui_theme = "omarchy"

[service]
# Persistent Syncthing user-service state, independent of the runtime toggle
service_state = "enabled"
# Seconds between probes for external systemd state changes
probe_interval_seconds = 15

[view]
# "name": alphabetical by folder name
# "active-first": syncing or scanning folders first
# "errors-first": folders with errors first
folder_sort = "name"
# Folder groups the selector shows: ["all"], or a list of one or more of
# "ready", "active", "errors", "paused", "unknown"; [] shows none
folder_filters = ["all"]
